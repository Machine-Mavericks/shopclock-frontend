<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ShopClock</title>

  <meta name="theme-color" content="#030712">
  <link rel="icon" href="./client/icon.svg" type="image/svg+xml">

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      gap: 40px;
      color: #f9fafb;
      background: radial-gradient(circle at top, #1f2937 0, #030712 55%);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
    }

    p {
      margin: 0;
      color: #9ca3af;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 200px;
      padding: 28px 20px;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 16px;
      background: rgb(17 24 39 / 92%);
      color: inherit;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .choice:hover,
    .choice:focus-visible {
      background: #1d4ed8;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }

    .choice .icon {
      font-size: 2rem;
    }

    .choice .label {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .choice .description {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .choice:hover .description,
    .choice:focus-visible .description {
      color: #dbeafe;
    }
  </style>
</head>

<body>
  <div>
    <h1>ShopClock</h1>
    <p>Choose which app to open</p>
  </div>

  <div class="choices">
    <a class="choice" href="./kiosk/">
      <span class="icon" aria-hidden="true">🖥️</span>
      <span class="label">Kiosk</span>
      <span class="description">Scan student QR codes to clock in/out</span>
    </a>

    <a class="choice" href="./client/">
      <span class="icon" aria-hidden="true">📱</span>
      <span class="label">Client</span>
      <span class="description">Show your time card QR code</span>
    </a>
  </div>
</body>
</html>
